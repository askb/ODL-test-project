---
# SPDX-License-Identifier: EPL-1.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: "Test E: Full Pipeline (Stage → Release → Central)"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      artifact-server:
        description: "Artifact server for staging"
        type: choice
        options:
          - artifactory
          - nexus2
        default: artifactory
      publish-central:
        description: "Publish to Maven Central"
        type: boolean
        default: false
      publishing-type:
        description: "Central Portal publishing type"
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
      dry-run:
        description: "Dry run (no real operations)"
        type: boolean
        default: true
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

jobs:
  # ================================================================
  # Job 1: Prepare — De-SNAPSHOT and build
  # ================================================================
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release-version: ${{ steps.prep.outputs.release-version }}
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run maven-stage-prep-action
        id: prep
        # yamllint disable-line rule:line-length
        uses: askb/maven-stage-prep-action@main
        with:
          project-name: testproject
          gerrit-branch: master
          version-method: sed

      - name: Validate release version
        run: |
          set -euo pipefail
          VERSION="${{ steps.prep.outputs.release-version }}"
          # SemVer regex (X.Y.Z with optional pre-release/build)
          SEMVER="^[vV]?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          SEMVER="${SEMVER}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::Invalid version format: $VERSION"
            echo "Expected SemVer (X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          echo "✅ Version $VERSION is valid SemVer"

      - name: Setup Java
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Maven deploy to local m2repo
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/m2repo"
          mvn clean deploy \
            -DaltDeploymentRepository="staging::default::file://${{ github.workspace }}/m2repo" \
            -DskipTests -B -q
          echo "Deployed $(find m2repo -type f | wc -l) files"

      - name: Upload staging workspace
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-workspace
          path: |
            m2repo/
            ${{ steps.prep.outputs.patch-path }}
            ${{ steps.prep.outputs.bundle-path }}
            ${{ steps.prep.outputs.taglist-path }}
          retention-days: 3

  # ================================================================
  # Job 2: Stage — Upload to Artifactory or Nexus 2
  # ================================================================
  stage:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download staging workspace
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-workspace

      # ---- Artifactory path (proven working) ----
      - name: Setup JFrog CLI
        if: inputs.artifact-server == 'artifactory'
        # yamllint disable-line rule:line-length
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ secrets.JFROG_URL }}
          JF_USER: ${{ secrets.JFROG_USERNAME }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: "Artifactory: Stage artifacts"
        if: inputs.artifact-server == 'artifactory' && inputs.dry-run != true
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.release-version }}"
          BUILD_NAME="testproject"
          BUILD_NUMBER="${{ github.run_number }}"

          # Upload excluding checksums (JFrog auto-generates them)
          jf rt upload "m2repo/(*)" "odltest-staging-local/{1}" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --flat=false \
            --exclusions="*.sha1;*.md5;*.sha256;*.sha512"

          # Build info publish (optional - may fail with project-scoped token)
          jf rt build-publish "$BUILD_NAME" "$BUILD_NUMBER" || \
            echo "⚠️ build-publish skipped (project-scoped token)"

          echo "✅ Staged to odltest-staging-local"

      # ---- Nexus 2 path ----
      - name: "Nexus 2: Stage artifacts"
        if: inputs.artifact-server == 'nexus2' && inputs.dry-run != true
        id: nexus-stage
        # yamllint disable-line rule:line-length
        uses: askb/nexus-staging-action@main
        with:
          nexus-server: https://nexus.opendaylight.org
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
          staging-profile-id: "96fca0367756c"
          mode: stage
          m2repo-path: m2repo
          description: >-
            testproject ${{ needs.prepare.outputs.release-version }}
            - run ${{ github.run_id }}

      # ---- Dry-run path ----
      - name: "Dry-run: Show what would be staged"
        if: inputs.dry-run == true
        run: |
          echo "=== DRY RUN — Would stage these artifacts ==="
          find m2repo -type f | sort | head -50
          echo ""
          echo "Artifact server: ${{ inputs.artifact-server }}"
          echo "Version: ${{ needs.prepare.outputs.release-version }}"

  # ================================================================
  # Job 3: Release — Promote + tag + publish to Central
  # ================================================================
  release:
    needs: [prepare, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: inputs.dry-run != true
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download staging workspace
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-workspace

      # ---- Verify bundle hash (JJB release-job.sh:582-594) ----
      - name: Verify taglist hash
        run: |
          set -euo pipefail
          if [ -f "archives/patches/taglist.log" ]; then
            TAG_HASH=$(awk '{print $NF}' archives/patches/taglist.log)
            HEAD_HASH=$(git rev-parse HEAD)
            echo "Taglist hash: $TAG_HASH"
            echo "HEAD hash:    $HEAD_HASH"
            if [ "$TAG_HASH" != "$HEAD_HASH" ]; then
              echo "::warning::Tag hash doesn't match HEAD (expected for test)"
            fi
          else
            echo "No taglist.log found (standalone test)"
          fi

      # ---- Artifactory promote (proven: jf rt copy) ----
      - name: Setup JFrog CLI
        if: inputs.artifact-server == 'artifactory'
        # yamllint disable-line rule:line-length
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ secrets.JFROG_URL }}
          JF_USER: ${{ secrets.JFROG_USERNAME }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: "Artifactory: Promote to releases"
        if: inputs.artifact-server == 'artifactory'
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.release-version }}"

          # Use jf rt copy (works with project-scoped tokens)
          jf rt copy \
            "odltest-staging-local/org/opendaylight/" \
            "odltest-releases-local/org/opendaylight/" \
            --flat=false

          echo "✅ Promoted to odltest-releases-local"

          # Cleanup staging
          jf rt delete \
            "odltest-staging-local/org/opendaylight/" \
            --quiet || true
          echo "🧹 Staging cleaned up"

      # ---- Nexus 2 promote ----
      - name: "Nexus 2: Promote staging repo"
        if: inputs.artifact-server == 'nexus2'
        # yamllint disable-line rule:line-length
        uses: askb/nexus-staging-action@main
        with:
          nexus-server: https://nexus.opendaylight.org
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
          staging-profile-id: "96fca0367756c"
          mode: promote
          staging-repo-id: ${{ needs.stage.outputs.staging-repo-id }}

      # ---- Create git tag (JJB tag-git-repo equivalent) ----
      - name: Create release tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.release-version }}"
          GIT_TAG="v${VERSION}"
          PROJECT="testproject"

          # Check for existing tag (JJB: lightweight tag collision check)
          if git rev-parse "$GIT_TAG" >/dev/null 2>&1; then
            TAG_TYPE=$(git cat-file -t "$GIT_TAG" 2>/dev/null || echo "unknown")
            if [ "$TAG_TYPE" = "tag" ]; then
              echo "INFO: Repo already has signed tag $GIT_TAG, nothing to do"
              exit 0
            else
              echo "::error::Lightweight tag $GIT_TAG exists, blocks signed tag"
              exit 1
            fi
          fi

          # Create annotated tag
          git tag -am "${PROJECT} ${GIT_TAG}" "$GIT_TAG"
          echo "✅ Created tag: $GIT_TAG"

          # Push tag (skip in test — no write access needed)
          # git push origin "$GIT_TAG"
          echo "⚠️ Skipping tag push (test mode)"

      # ---- Central Portal publish (using proven action) ----
      - name: "Central: Publish to Maven Central"
        if: inputs.publish-central == true
        # yamllint disable-line rule:line-length
        uses: askb/central-publish-action@master
        with:
          m2repo-path: m2repo
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          publishing-type: ${{ inputs.publishing-type }}
          dry-run: "false"

  # ================================================================
  # Job 4: Summary
  # ================================================================
  summary:
    needs: [prepare, stage, release]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Pipeline summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Full Pipeline Results

          | Stage | Status |
          |-------|--------|
          | Prepare | ${{ needs.prepare.result }} |
          | Stage | ${{ needs.stage.result }} |
          | Release | ${{ needs.release.result }} |

          | Setting | Value |
          |---------|-------|
          | Version | ${{ needs.prepare.outputs.release-version }} |
          | Artifact Server | ${{ inputs.artifact-server }} |
          | Publish Central | ${{ inputs.publish-central }} |
          | Dry Run | ${{ inputs.dry-run }} |
          EOF

