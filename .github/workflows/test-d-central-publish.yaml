name: "Test D: Maven Central Portal Upload"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      signing-method:
        description: "How to sign artifacts before Central upload"
        type: choice
        options:
          - sigul
          - gpg
        default: sigul
      publishing-type:
        description: "Central Portal publishing type"
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
      dry-run:
        description: "Dry run (skip actual upload)"
        type: boolean
        default: true
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Maven build + deploy locally
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/m2repo"

          # De-SNAPSHOT for release
          find . -name "pom.xml" -exec sed -i \
            "s/1.0.0-SNAPSHOT/1.0.0/g" {} +

          mvn clean deploy \
            -DaltDeploymentRepository="staging::default::file://${{ github.workspace }}/m2repo" \
            -DskipTests -B -q

          echo "Deployed $(find m2repo -type f | wc -l) files to local repo"

      - name: Build sigul sign list
        if: inputs.signing-method == 'sigul'
        run: |
          set -euo pipefail
          # Explicit file list (no globs) — the sigul Docker action signs each
          # newline-delimited path. Same artifact set central-publish verifies.
          {
            echo "SIGN_LIST<<SIGEOF"
            find m2repo -type f \
              \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \)
            echo "SIGEOF"
          } >> "$GITHUB_ENV"

      - name: Sign m2repo with Sigul
        if: inputs.signing-method == 'sigul'
        # yamllint disable-line rule:line-length
        uses: askb/sigul-sign-action@8306f9ef0470a7f52f5b1c354ad1822ea0a731b3 # CentOS7-EOL + armor fix
        with:
          sign-type: "sign-data"
          sign-object: ${{ env.SIGN_LIST }}
          sigul-ip: ${{ vars.SIGUL_IP }}
          sigul-uri: ${{ vars.SIGUL_URI }}
          sigul-conf: ${{ secrets.SIGUL_CONF }}
          sigul-key-name: ${{ vars.SIGUL_KEY_NAME }}
          sigul-pass: ${{ secrets.SIGUL_PASS }}
          sigul-pki: ${{ secrets.SIGUL_PKI }}

      - name: Publish to Maven Central
        # yamllint disable-line rule:line-length
        uses: askb/central-publish-action@master
        with:
          m2repo-path: m2repo
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          signing-method: ${{ inputs.signing-method }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          publishing-type: ${{ inputs.publishing-type }}
          dry-run: ${{ inputs.dry-run }}

