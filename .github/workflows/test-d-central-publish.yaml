# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: "Test D: Maven Central Portal Upload"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      publishing-type:
        description: "Central Portal publishing type"
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
      dry-run:
        description: "Dry run (skip actual upload)"
        type: boolean
        default: true
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Maven build + deploy locally
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/m2repo"

          # De-SNAPSHOT for release
          find . -name "pom.xml" -exec sed -i \
            "s/1.0.0-SNAPSHOT/1.0.0/g" {} +

          mvn clean deploy \
            -DaltDeploymentRepository="staging::default::file://${{ github.workspace }}/m2repo" \
            -DskipTests -B -q

          echo "Deployed $(find m2repo -type f | wc -l) files to local repo"

      - name: Publish to Maven Central
        # yamllint disable-line rule:line-length
        uses: askb/central-publish-action@master
        with:
          m2repo-path: m2repo
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          publishing-type: ${{ inputs.publishing-type }}
          dry-run: ${{ inputs.dry-run }}

